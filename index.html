<body>
<section id="zt-overzicht-model">
  <style>
    #zt-overzicht-model{color-scheme:light dark;--paper:light-dark(#f6f5f0,#1c2622);--surface:light-dark(#fff,#24312a);--ink:light-dark(#1e352e,#e7eee9);--muted:light-dark(#52665d,#b9c9c0);--line:light-dark(#d9e0d7,#41584b);--active:light-dark(#285746,#a8d3bc);--on-active:light-dark(#fff,#193329);background:var(--paper);color:var(--ink);padding:clamp(12px,3vw,26px);border-radius:14px;font:14px/1.45 system-ui,sans-serif}
    #zt-overzicht-model *{box-sizing:border-box}
    #zt-overzicht-model [hidden]{display:none!important}
    #zt-overzicht-model h2,#zt-overzicht-model h3,#zt-overzicht-model p{margin:0}
    #zt-overzicht-model h2{font:400 clamp(28px,5vw,45px)/1.08 Georgia,serif}
    #zt-overzicht-model h3{font:400 23px/1.15 Georgia,serif}
    #zt-overzicht-model .zt-small{font-size:12px;color:var(--muted)}
    #zt-overzicht-model .zt-status{display:inline-flex;align-items:center;gap:6px}
    #zt-overzicht-model .zt-available-dot{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:#19844a}
    #zt-overzicht-model .zt-map .zt-available-dot{margin-right:5px;vertical-align:middle}
    #zt-overzicht-model button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px}
    #zt-overzicht-model button[aria-pressed=true]{background:var(--active);color:var(--on-active);border-color:var(--active)}
    #zt-overzicht-model .zt-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    #zt-overzicht-model header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center;margin:8px 0 14px}
    #zt-overzicht-model header img{width:100%;height:155px;object-fit:cover;border-radius:9px}
    #zt-overzicht-model header p{margin-top:4px}
    #zt-overzicht-model .zt-homes,#zt-overzicht-model .zt-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:9px;margin-top:9px}
    #zt-overzicht-model .zt-tile{width:100%;overflow:hidden;text-align:left;padding:0}
    #zt-overzicht-model .zt-tile img{width:100%;height:111px;object-fit:cover;display:block}
    #zt-overzicht-model .zt-tile.zt-plan img{height:160px;object-fit:contain;background:var(--paper)}
    #zt-overzicht-model .zt-label{display:grid;padding:7px 9px;gap:2px}
    #zt-overzicht-model .zt-cta{color:var(--active)}
    #zt-overzicht-model .zt-body{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:11px}
    #zt-overzicht-model .zt-price{font-size:18px;font-weight:650}
    #zt-overzicht-model .zt-body p{margin:7px 0}
    #zt-overzicht-model .zt-focus img{display:block;max-width:100%;max-height:365px;margin:9px auto;object-fit:contain}
    #zt-overzicht-model .zt-map{position:relative;margin-top:7px}
    #zt-overzicht-model .zt-map img{display:block;width:100%;height:auto}
    #zt-overzicht-model .zt-map button{position:absolute;padding:0;min-height:28px}
    @media(max-width:520px){#zt-overzicht-model header{grid-template-columns:1fr}#zt-overzicht-model header img{height:125px}}
  </style>

    #zt-overzicht-model{color-scheme:light;--paper:#f5f8fc;--surface:#fff;--ink:#0b131e;--muted:#3d5170;--line:#dce6ef;--active:#0863a3;--on-active:#fff;--sky:#0d9df0;--pale:#eff9ff;background:radial-gradient(ellipse at 0 16%,#dff2ff 0,transparent 54%),var(--paper);font-family:ZT-Jakarta,system-ui,sans-serif;border-radius:20px}
    #zt-overzicht-model h2,#zt-overzicht-model h3{font-family:ZT-Outfit,system-ui,sans-serif;letter-spacing:-.025em}
    #zt-overzicht-model h2{font-size:clamp(28px,5vw,46px)}
    #zt-overzicht-model .zt-brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 12px;margin:0 0 14px;border-bottom:1px solid var(--line)}
    #zt-overzicht-model .zt-brand img{display:block;width:154px;max-width:55%;height:auto}
    #zt-overzicht-model .zt-brand span{color:var(--muted);font-size:12px}
    #zt-overzicht-model header .zt-small:first-child{color:var(--active);letter-spacing:.09em;font-weight:600}
    #zt-overzicht-model header img{border-radius:24px 24px 14px 14px}
    #zt-overzicht-model button{border-radius:18px;font-weight:600}
    #zt-overzicht-model button:hover{border-color:var(--sky)}
    #zt-overzicht-model button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
    #zt-overzicht-model .zt-tile{border-radius:16px;box-shadow:0 5px 15px #0b131e08}
    #zt-overzicht-model .zt-label{padding:9px 10px 10px}
    #zt-overzicht-model .zt-label strong{font:400 17px/1.15 ZT-Outfit,system-ui,sans-serif}
    #zt-overzicht-model .zt-cta{margin-top:2px;font-weight:600}
    #zt-overzicht-model .zt-body{border-radius:16px}

      const root = document.getElementById("zt-overzicht-model");
      const screen = root.querySelector("[data-screen]");
      const bounds = [[44,155],[229,164],[423,154],[605,96],[719,96]];
      const money = new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR",maximumFractionDigits:0});
      const price = unit => unit.price == null ? "Nog niet bekend" : money.format(unit.price) + " v.o.n.";
      const status = unit => ({beschikbaar:"Beschikbaar",optie:"In optie",verkocht:"Verkocht"}[unit.status] || "Status volgt");
      const availableDot = unit => unit.status === "beschikbaar" ? '<span class="zt-available-dot" aria-hidden="true"></span>' : "";
      const statusLabel = unit => `<span class="zt-status">${availableDot(unit)}${status(unit)}</span>`;
      const show = (label,key,value,pressed) => `<button type="button" data-${key}="${value}"${pressed===undefined?"":` aria-pressed="${pressed}"`}>${label}</button>`;
      let home = null, tab = "plans", group = "outside", option = false, expanded = null, map = false, overviewVideo = false;
      function mapView(){
        return `<div class="zt-map"><img src="${data.map}" width="849" height="436" alt="Verkaveling van vijf woningen met achtertuinen aan het water">
          ${bounds.map(([x,w],i)=>{
            const unit = data.homes[i];
            return `<button type="button" data-home="${i}" aria-label="Bekijk ${unit.name}, ${status(unit)}" style="left:${x/849*100}%;width:${w/849*100}%;top:13%;height:15%">${availableDot(unit)}${unit.name}</button>`;
          }).join("")}</div>`;
      }
      function overview(){
        return `<div class="zt-hero">
          ${videoMedia("zomertaling-waterzijde.mp4",{src:data.hero,title:"Zomertalingstraat aan het water"},"Zomertalingstraat vanaf het water")}
          <div class="zt-hero-copy"><p class="zt-small" style="color:#dff2ff">BELLEVUE WONEN · HEERHUGOWAARD</p><h2>Wonen aan het water<br>in De Draai.</h2><p>Ontdek vijf woningen aan de Zomertalingstraat. Bekijk de woningen, kies jouw favoriet en schrijf je in.</p>${show("Bekijk de woningen","browse",1)}</div>
        </div><div class="zt-section-heading"><div><p class="zt-eyebrow">ZOMERTALINGSTRAAT · HEERHUGOWAARD</p><h3 id="zt-homes-title">Welke woning past bij jou?</h3></div><p>Vijf woningen. Jouw eigen plek aan het water.</p></div>
          <div class="zt-row" role="group" aria-label="Manier van kiezen">${show("Woningoverzicht","map",0,!map)}${show("Kies op verkaveling","map",1,map)}<a href="./verken-3d/index.html" style="display:inline-flex;padding:11px 18px;border:1px solid #b9d7eb;border-radius:8px;background:#eaf5fc;color:#0863a3;text-decoration:none;font-weight:600">Verken het project in 3D ↗</a></div>

            <img src="${data.photos[unit.outside[0]].src}" alt="">
            <span class="zt-label"><strong>${unit.name}</strong><span class="zt-small">${statusLabel(unit)}</span><span class="zt-card-type">${unit.type} · ${unit.bedrooms} slaapkamers</span><span class="zt-card-price">${price(unit)}</span><span class="zt-cta">Bekijk woning →</span></span>
          </button>`).join("")}</div>`}`;
      }
      function overviewMedia(){
        const photo = {src:data.hero,title:"Straatbeeld van de Zomertalingstraat"};
        const media = overviewVideo
          ? videoMedia("zomertaling-waterzijde.mp4", photo, "Projectimpressie vanaf het water")
          : `<img src="${photo.src}" alt="${photo.title}">`;
        return `<div class="zt-project-hero">${media}${show(overviewVideo?"Toon straatbeeld":"Bekijk video vanaf het water","film",1)}</div>`;
      }
      function heroMedia(unit){
        const photo = data.photos[unit.outside[0]];
        if(unit.name === "BN03" || unit.name === "BN04" || unit.name === "BN05") return `<img src="${photo.src}" alt="${photo.title}" style="width:100%;height:auto;object-fit:contain" decoding="async">`;
        if(unit.name === "BN01") return videoMedia("a-hoek-impressie.mp4", photo, "Video-impressie van de hoekwoning");
        if(unit.name.startsWith("A-standaard")) return videoMedia("zomertaling-waterzijde.mp4", photo, "Gedeelde projectimpressie vanaf het water");
        return videoMedia("b-woningen-impressie.mp4", photo, "Video-impressie van de tweekapper");
      }
      function videoMedia(file, photo, label){
        const auto = matchMedia("(prefers-reduced-motion: reduce)").matches ? "" : " autoplay";
        return `<div class="zt-video">
          <video src="./${file}" poster="${photo.src}" muted loop playsinline${auto} preload="metadata" aria-label="${label}"></video>
          <img src="${photo.src}" alt="${photo.title}" data-video-fallback hidden>
          <button type="button" class="zt-video-toggle" data-video-toggle>Video afspelen</button>
        </div>`;
      }
      const zoomLevels = [1, 1.5, 2, 3, 4];
      let zoomIndex = 0;
      function focusedMedia(item, plans){
        const pageNumber = plans && !item.imageOnly && !item.pdf ? Number(item.src.match(/b-(\d+)\.webp$/)[1]) : null;
        const link = plans && !item.imageOnly ? (item.pdf || data.pdf + "#page=" + pageNumber) : item.src;
        return `<div class="zt-focus${plans ? " zt-focus-plan" : ""}">
          <div class="zt-row zt-zoom-controls">
            ${show(plans?"Terug naar plattegronden":"Terug naar beelden","close",1)}
            <button type="button" data-zoom="-1" aria-label="Uitzoomen" disabled>−</button>
            <span data-zoom-label aria-live="polite">100%</span>
            <button type="button" data-zoom="1" aria-label="Inzoomen">+</button>
            <a class="zt-full-link" href="${link}" target="_blank" rel="noopener">${plans && !item.imageOnly ? "Open dit blad in PDF ↗" : "Open op ware grootte ↗"}</a>
          </div>
          <div class="zt-zoom-window" data-zoom-window tabindex="0" role="region" aria-label="${item.title}">
            <img src="${item.src}" alt="${item.title}">
          </div>
        </div>`;
      }
      function zoomMedia(step){
        const area = screen.querySelector("[data-zoom-window]");
        const image = area.querySelector("img");
        if(!image.offsetWidth || !image.offsetHeight) return;
        const x = (area.scrollLeft + area.clientWidth / 2 - image.offsetLeft) / image.offsetWidth;
        const y = (area.scrollTop + area.clientHeight / 2) / image.offsetHeight;
        zoomIndex = Math.max(0, Math.min(zoomLevels.length-1, zoomIndex+step));
        const scale = zoomLevels[zoomIndex];
        area.style.setProperty("--zt-scale", scale);
        area.scrollLeft = x * image.offsetWidth + image.offsetLeft - area.clientWidth / 2;
        area.scrollTop = y * image.offsetHeight - area.clientHeight / 2;
        screen.querySelector("[data-zoom-label]").textContent = Math.round(scale*100) + "%";
        screen.querySelector('[data-zoom="-1"]').disabled = zoomIndex === 0;
        screen.querySelector('[data-zoom="1"]').disabled = zoomIndex === zoomLevels.length-1;
      }
      function detail(){
        const unit = data.homes[home], plans = tab === "plans";
        const list = plans ? unit.plans.flatMap(plan=>{
          const drawing = {title:plan.title,src:option&&plan.option?plan.option:plan.src,pdf:option&&plan.option?plan.optionPdf:plan.pdf};
          if(plan.title!=="1e verdieping") return [drawing];
          return [drawing, ...unit.floor3d.map(key=>({...data.photos[key], imageOnly:true}))];
        })
          : (group==="project"?data.project:unit[group]).map(src=>data.photos[src]);
        const tabs = show("Plattegronden","tab","plans",plans)+show("Impressies","tab","photos",!plans);
        const controls = plans
          ? show("Basis","option",0,!option)+show("Badkamer beneden","option",1,option)
          : [["outside","Buiten"],["inside","Binnen"],["floor3d","1e verdieping (3D)"],["project","Project"]].map(([key,label])=>show(label,"group",key,group===key)).join("");
        const current = list[expanded];
        const gallery = expanded!==null && current
          ? focusedMedia(current, plans)
          : list.length ? `<div class="zt-gallery">${list.map((item,i)=>`<button type="button" class="zt-tile${plans||group==="floor3d"?" zt-plan":""}" data-image="${i}">
            <img src="${item.src}" alt="" loading="lazy"><span class="zt-label">${item.title}</span></button>`).join("")}</div>`
          : "<p>Voor deze woning is geen binnenimpressie beschikbaar.</p>";
        return `${show("← Alle woningen","back",1)}
          <header><div><p class="zt-small">ZOMERTALINGSTRAAT</p><h2>${unit.name}</h2><p>${unit.type}</p>
            <p class="zt-price">${price(unit)}</p><p class="zt-small">${statusLabel(unit)} · ${unit.bedrooms} slaapkamers</p><a class="zt-primary zt-register zt-download" href="./Zomertalingstraat-inschrijfformulier.pdf" download>Download inschrijfformulier (PDF)</a></div>
            ${heroMedia(unit)}</header>
          <div class="zt-body"><div class="zt-row" role="group" aria-label="Woninginformatie">${tabs}</div>
            <p class="zt-small">${plans?"Klik op een plattegrond om te vergroten.":"Beelden van de woning en het project"}</p><div class="zt-row">${controls}</div>
            ${plans&&option&&unit.note?`<p class="zt-small">${unit.note}</p>`:""}${gallery}</div><div class="zt-mobile-register"><div><small>${unit.name}</small><strong>${price(unit)}</strong></div><a class="zt-primary zt-download" href="./Zomertalingstraat-inschrijfformulier.pdf" download>Download inschrijfformulier (PDF)</a></div>`;
      }
      function render(){
        screen.innerHTML = home===null ? overview() : detail();
        root.classList.toggle("zt-detail-open",home!==null);
        const video = screen.querySelector(".zt-video video");
        if(!video) return;
        const button = screen.querySelector("[data-video-toggle]");
        const fallback = screen.querySelector("[data-video-fallback]");
        if(home===null){window.setupHeroLoop(video,video.parentElement,button);return;}
        const updateLabel = () => { button.textContent = video.paused ? "Video afspelen" : "Video pauzeren"; };
        video.addEventListener("play", updateLabel);
        video.addEventListener("pause", updateLabel);
        video.addEventListener("error", () => {
          screen.querySelector("[data-video-next]")?.remove();
          video.hidden = true;
          button.hidden = true;
          fallback.hidden = false;
        });
        video.muted = true;
        if(video.autoplay) video.play().catch(updateLabel);
      }
      root.addEventListener("click", event=>{
        const button = event.target.closest("button");
        if(!button) return;
        if(button.hasAttribute("data-browse")){root.querySelector(".zt-homes, .zt-map")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth",block:"start"});return;}
        if(button.hasAttribute("data-video-next")){const video=screen.querySelector(".zt-video video");video.heroController?.next();return;}
        if(button.hasAttribute("data-video-toggle")){
          const video = screen.querySelector(".zt-video video");
          if(video.heroController){video.heroController.toggle();return;}
          if(video.paused) video.play().catch(() => {});
          else video.pause();
          return;
        }
        if(button.hasAttribute("data-zoom")){
          zoomMedia(Number(button.dataset.zoom));
          return;
        }
        const [key,value] = Object.entries(button.dataset)[0];
        const previous = home;
        if(key==="home"){home=Number(value);tab="plans";group="outside";option=false;}
        if(key==="back") home=null;
        if(key==="map") map=value==="1";
        if(key==="film") overviewVideo = !overviewVideo;
        if(key==="tab") tab=value;
        if(key==="group") group=value;
        if(key==="option") option=value==="1";
        expanded=key==="image"?Number(value):null;
        zoomIndex = 0;
        render();
        if(key==="home") root.querySelector("[data-back]")?.focus();
        else if(key==="back") root.querySelector(`[data-home="${previous}"]`)?.focus();
        else if(key==="image") root.querySelector("[data-close]")?.focus();
        else if(key==="close") root.querySelector("[data-image]")?.focus();
        else root.querySelector(`[data-${key}="${value}"]`)?.focus();
      });
      const fromHash=()=>{const m=location.hash.match(/^#bn0([1-5])$/);return m?Number(m[1])-1:null;};
      home=fromHash();
      addEventListener("hashchange",()=>{const h=fromHash();if(h!==home){home=h;tab="plans";group="outside";option=false;expanded=null;render();}});
      render();
    })();
